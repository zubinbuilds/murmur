<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Murmur</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar">
    <span class="wordmark">murmur</span>
    <span class="meta" id="meta"></span>
    <span class="conn" id="conn" title="Connecting"><span class="dot"></span><span id="conn-text"></span></span>
  </header>

  <main class="layout">
    <section class="stage" aria-label="Live transcript">
      <div class="controls">
        <button id="listen" class="listen" type="button">Start</button>
        <button id="clear" class="btn" type="button">Clear</button>
        <div class="meter" id="meter" role="meter" aria-label="Mic level in decibels" aria-valuemin="-90" aria-valuemax="0" aria-valuenow="-90">
          <div class="meter-fill" id="meter-fill"></div>
          <div class="meter-gate" id="meter-gate"></div>
        </div>
        <span class="tag armed hidden" id="armed" role="status">Say command</span>
        <button id="enroll" class="btn" type="button">Enroll me</button>
        <span class="owner" id="owner" role="status">You: not set</span>
      </div>

      <div class="calib hidden" id="calib">
        <span>Calibrate:</span>
        <button id="cal-noise" class="btn" type="button">1. Stay quiet (3 s)</button>
        <button id="cal-whisper" class="btn" type="button">2. Whisper (3 s)</button>
        <span class="cal-msg" id="cal-msg" role="status"></span>
      </div>

      <div class="transcript" id="transcript" aria-live="polite">
        <p class="empty" id="empty">Start, then whisper.</p>
        <p class="partial" id="partial" aria-hidden="true"></p>
      </div>
      <button id="jump" class="jump hidden" type="button">Latest ↓</button>
    </section>

    <aside class="rail" aria-label="Commands">
      <ol class="log" id="log"></ol>

      <details class="more">
        <summary>Settings</summary>
        <form id="say-form" class="row">
          <input id="say-text" type="text" aria-label="Test without speaking" placeholder="Hey Murmur, text Sam I'm running late" autocomplete="off" maxlength="500">
          <button type="submit" class="btn dark">Send</button>
        </form>
        <select id="engine" aria-label="Speech engine">
          <option value="elevenlabs">ElevenLabs Scribe v3 Live</option>
          <option value="deepgram">Deepgram Nova-3</option>
          <option value="pipecat">Deepgram Nova-3 via Pipecat</option>
          <option value="mock">Mock</option>
        </select>
        <label class="check"><input type="checkbox" id="whisper-only"> Whispers only</label>
        <button id="recal" class="link" type="button">Recalibrate</button>
        <p class="hint" id="note" role="status"></p>
        <p class="hint" id="ignored"></p>
        <p class="hint" id="band-detail"></p>
      </details>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
